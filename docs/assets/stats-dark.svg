<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150" viewBox="0 0 1100 150" fill="none" role="img" aria-label="Key figures">
<title>Key figures</title>
<style>
.sans{font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,"Courier New",monospace}
.fade{opacity:0;animation:fade .9s ease-out forwards}
.rise{opacity:0;animation:rise .9s cubic-bezier(.22,.7,.3,1) forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:0.20;transform:scale(1)}50%{opacity:0.42;transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translate(0,0)}25%{transform:translate(-14px,-18px)}50%{transform:translate(10px,-8px)}75%{transform:translate(-8px,14px)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes shimmer{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.d0{animation-delay:0.00s}.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}.d25{animation-delay:3.00s}.d26{animation-delay:3.12s}.d27{animation-delay:3.24s}.d28{animation-delay:3.36s}.d29{animation-delay:3.48s}.d30{animation-delay:3.60s}.d31{animation-delay:3.72s}.d32{animation-delay:3.84s}.d33{animation-delay:3.96s}.d34{animation-delay:4.08s}.d35{animation-delay:4.20s}.d36{animation-delay:4.32s}.d37{animation-delay:4.44s}.d38{animation-delay:4.56s}.d39{animation-delay:4.68s}</style>
<defs><linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#FF6B00" stop-opacity="0"/><stop offset=".5" stop-color="#FF6B00"/><stop offset="1" stop-color="#FF6B00" stop-opacity="0"/></linearGradient></defs>

<g class="rise" style="animation-delay:0.20s">
  <rect x="0.5" y=".5" width="169.0" height="149" rx="20" fill="#141414" stroke="#2a2a2a"/>
  <rect x="22.0" y="0" width="126.0" height="2" fill="url(#top)"/>
  <text class="sans" x="22.0" y="62" font-size="28" font-weight="900" letter-spacing="-1" fill="#FF6B00">30 kg</text>
  <text class="sans" x="22.0" y="92" font-size="13" font-weight="700" fill="#ffffff">Max payload</text>
  <text class="sans" x="22.0" y="112" font-size="11" fill="#a3a3a3">scissor lift + suction head</text>
</g>
<g class="rise" style="animation-delay:0.32s">
  <rect x="186.5" y=".5" width="169.0" height="149" rx="20" fill="#141414" stroke="#2a2a2a"/>
  <rect x="208.0" y="0" width="126.0" height="2" fill="url(#top)"/>
  <text class="sans" x="208.0" y="62" font-size="28" font-weight="900" letter-spacing="-1" fill="#FF6B00">434 mm</text>
  <text class="sans" x="208.0" y="92" font-size="13" font-weight="700" fill="#ffffff">Lift stroke</text>
  <text class="sans" x="208.0" y="112" font-size="11" fill="#a3a3a3">1.32 m reach at full height</text>
</g>
<g class="rise" style="animation-delay:0.44s">
  <rect x="372.5" y=".5" width="169.0" height="149" rx="20" fill="#141414" stroke="#2a2a2a"/>
  <rect x="394.0" y="0" width="126.0" height="2" fill="url(#top)"/>
  <text class="sans" x="394.0" y="62" font-size="34" font-weight="900" letter-spacing="-1" fill="#FF6B00">360°</text>
  <text class="sans" x="394.0" y="92" font-size="13" font-weight="700" fill="#ffffff">LiDAR coverage</text>
  <text class="sans" x="394.0" y="112" font-size="11" fill="#a3a3a3">RPLIDAR C1 · 12 m range</text>
</g>
<g class="rise" style="animation-delay:0.56s">
  <rect x="558.5" y=".5" width="169.0" height="149" rx="20" fill="#141414" stroke="#2a2a2a"/>
  <rect x="580.0" y="0" width="126.0" height="2" fill="url(#top)"/>
  <text class="sans" x="580.0" y="62" font-size="34" font-weight="900" letter-spacing="-1" fill="#FF6B00">8</text>
  <text class="sans" x="580.0" y="92" font-size="13" font-weight="700" fill="#ffffff">Mission steps</text>
  <text class="sans" x="580.0" y="112" font-size="11" fill="#a3a3a3">from one dashboard click</text>
</g>
<g class="rise" style="animation-delay:0.68s">
  <rect x="744.5" y=".5" width="169.0" height="149" rx="20" fill="#141414" stroke="#2a2a2a"/>
  <rect x="766.0" y="0" width="126.0" height="2" fill="url(#top)"/>
  <text class="sans" x="766.0" y="62" font-size="34" font-weight="900" letter-spacing="-1" fill="#FF6B00">24/7</text>
  <text class="sans" x="766.0" y="92" font-size="13" font-weight="700" fill="#ffffff">Operation</text>
  <text class="sans" x="766.0" y="112" font-size="11" fill="#a3a3a3">two isolated 6S Li-ion rails</text>
</g>
<g class="rise" style="animation-delay:0.80s">
  <rect x="930.5" y=".5" width="169.0" height="149" rx="20" fill="#141414" stroke="#2a2a2a"/>
  <rect x="952.0" y="0" width="126.0" height="2" fill="url(#top)"/>
  <text class="sans" x="952.0" y="62" font-size="34" font-weight="900" letter-spacing="-1" fill="#FF6B00">4</text>
  <text class="sans" x="952.0" y="92" font-size="13" font-weight="700" fill="#ffffff">Subsystems</text>
  <text class="sans" x="952.0" y="112" font-size="11" fill="#a3a3a3">10 integrated technologies</text>
</g>
</svg>
