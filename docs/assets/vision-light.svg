<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" fill="none" role="img" aria-label="Vision pipeline: YOLOv8 localisation, multi-decoder QR read and visual-servo centring">
<title>Vision pipeline: YOLOv8 localisation, multi-decoder QR read and visual-servo centring</title>
<style>
.sans{font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
