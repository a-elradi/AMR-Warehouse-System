<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" fill="none" role="img" aria-label="Mission state machine: eight steps from dashboard click to return home">
<title>Mission state machine: eight steps from dashboard click to return home</title>
<style>
.sans{font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,"Courier New",monospace}
.fade{opacity:0;animation:fade .9s ease-out forwards}
.rise{opacity:0;animation:rise .9s cubic-bezier(.22,.7,.3,1) forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:0.20;transform:scale(1)}50%{opacity:0.42;transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translate(0,0)}25%{transform:translate(-14px,-18px)}50%{transform:translate(10px,-8px)}75%{transform:translate(-8px,14px)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes shimmer{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.d0{animation-delay:0.00s}.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}.d25{animation-delay:3.00s}.d26{animation-delay:3.12s}.d27{animation-delay:3.24s}.d28{animation-delay:3.36s}.d29{animation-delay:3.48s}.d30{animation-delay:3.60s}.d31{animation-delay:3.72s}.d32{animation-delay:3.84s}.d33{animation-delay:3.96s}.d34{animation-delay:4.08s}.d35{animation-delay:4.20s}.d36{animation-delay:4.32s}.d37{animation-delay:4.44s}.d38{animation-delay:4.56s}.d39{animation-delay:4.68s}.flow{animation:dash 1.6s linear infinite}</style>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#2a2a2a" stroke-width="1"/></pattern></defs>

<rect width="1100" height="330" rx="24" fill="#0a0a0a"/>
<rect width="1100" height="330" rx="24" fill="url(#grid)" opacity="0.55"/>
<path d="M15.0,92 H1085.0 Q1115.0,92 1115.0,122 V202 Q1115.0,232 1085.0,232 H15.0" stroke="#2a2a2a" stroke-width="2"/>
<path class="flow" d="M15.0,92 H1085.0 Q1115.0,92 1115.0,122 V202 Q1115.0,232 1085.0,232 H15.0" stroke="#FF6B00" stroke-opacity=".6" stroke-width="2" stroke-dasharray="8 10"/>
<circle r="5" fill="#FF9A40"><animateMotion dur="12s" repeatCount="indefinite" path="M15.0,92 H1085.0 Q1115.0,92 1115.0,122 V202 Q1115.0,232 1085.0,232 H15.0"/></circle>
<circle r="5" fill="#FF9A40"><animateMotion dur="12s" begin="6s" repeatCount="indefinite" path="M15.0,92 H1085.0 Q1115.0,92 1115.0,122 V202 Q1115.0,232 1085.0,232 H15.0"/></circle>
<g class="fade d2">
  <rect x="25.0" y="18" width="372" height="28" rx="14" fill="#141414" stroke="#FF6B00" stroke-opacity=".6"/>
  <circle cx="41.0" cy="32" r="4" fill="#00CC66"/>
  <text class="mono" x="53.0" y="36" font-size="10" letter-spacing="1" fill="#ffffff">DASHBOARD PICK → MQTT amr/orders → /mission/start</text>
</g>
<g class="fade d9">
  <rect x="745.0" y="284" width="330" height="28" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="761.0" cy="298" r="4" fill="#00CC66"/>
  <text class="mono" x="773.0" y="302" font-size="10" letter-spacing="1" fill="#ffffff">MISSION COMPLETE → amr/status state: IDLE</text>
</g>
<text class="mono" x="25.0" y="302" font-size="10" letter-spacing="2" fill="#6b6b6b">EVT FAULT &lt;what&gt; OR TIMEOUT → STOP · MISSION ABORT</text>

<g class="rise" style="animation-delay:0.40s">
  <rect x="25.0" y="60" width="240" height="64" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="51.0" cy="92" r="14" fill="#FF6B00"/>
  <text class="sans" x="51.0" y="97" text-anchor="middle" font-size="13" font-weight="900" fill="#0a0a0a">1</text>
  <text class="sans" x="75.0" y="88" font-size="14" font-weight="800" fill="#ffffff">Navigate to shelf</text>
  <text class="mono" x="75.0" y="107" font-size="9.5" fill="#a3a3a3">Nav2 · AMCL · /cmd_vel_nav</text>
</g>
<g class="rise" style="animation-delay:0.54s">
  <rect x="295.0" y="60" width="240" height="64" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="321.0" cy="92" r="14" fill="#FF6B00"/>
  <text class="sans" x="321.0" y="97" text-anchor="middle" font-size="13" font-weight="900" fill="#0a0a0a">2</text>
  <text class="sans" x="345.0" y="88" font-size="14" font-weight="800" fill="#ffffff">Confirm shelf QR</text>
  <text class="mono" x="345.0" y="107" font-size="9.5" fill="#a3a3a3">/vision/request SHELF_QR → OK</text>
</g>
<g class="rise" style="animation-delay:0.68s">
  <rect x="565.0" y="60" width="240" height="64" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="591.0" cy="92" r="14" fill="#FF6B00"/>
  <text class="sans" x="591.0" y="97" text-anchor="middle" font-size="13" font-weight="900" fill="#0a0a0a">3</text>
  <text class="sans" x="615.0" y="88" font-size="14" font-weight="800" fill="#ffffff">Raise the lift</text>
  <text class="mono" x="615.0" y="107" font-size="9.5" fill="#a3a3a3">PICK → EVT LIFT DONE</text>
</g>
<g class="rise" style="animation-delay:0.82s">
  <rect x="835.0" y="60" width="240" height="64" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="861.0" cy="92" r="14" fill="#FF6B00"/>
  <text class="sans" x="861.0" y="97" text-anchor="middle" font-size="13" font-weight="900" fill="#0a0a0a">4</text>
  <text class="sans" x="885.0" y="88" font-size="14" font-weight="800" fill="#ffffff">Centre on the box</text>
  <text class="mono" x="885.0" y="107" font-size="9.5" fill="#a3a3a3">BOX_QR · visual servo → OK</text>
</g>
<g class="rise" style="animation-delay:0.96s">
  <rect x="835.0" y="200" width="240" height="64" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="861.0" cy="232" r="14" fill="#FF6B00"/>
  <text class="sans" x="861.0" y="237" text-anchor="middle" font-size="13" font-weight="900" fill="#0a0a0a">5</text>
  <text class="sans" x="885.0" y="228" font-size="14" font-weight="800" fill="#ffffff">Grip the box</text>
  <text class="mono" x="885.0" y="247" font-size="9.5" fill="#a3a3a3">STEP EXT → PUMP ON → STEP RET</text>
</g>
<g class="rise" style="animation-delay:1.10s">
  <rect x="565.0" y="200" width="240" height="64" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="591.0" cy="232" r="14" fill="#FF6B00"/>
  <text class="sans" x="591.0" y="237" text-anchor="middle" font-size="13" font-weight="900" fill="#0a0a0a">6</text>
  <text class="sans" x="615.0" y="228" font-size="14" font-weight="800" fill="#ffffff">Lower the lift</text>
  <text class="mono" x="615.0" y="247" font-size="9.5" fill="#a3a3a3">LIFT 0 → EVT LIFT DONE</text>
</g>
<g class="rise" style="animation-delay:1.24s">
  <rect x="295.0" y="200" width="240" height="64" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="321.0" cy="232" r="14" fill="#FF6B00"/>
  <text class="sans" x="321.0" y="237" text-anchor="middle" font-size="13" font-weight="900" fill="#0a0a0a">7</text>
  <text class="sans" x="345.0" y="228" font-size="14" font-weight="800" fill="#ffffff">Navigate to drop-off</text>
  <text class="mono" x="345.0" y="247" font-size="9.5" fill="#a3a3a3">Nav2 → dropoff pose</text>
</g>
<g class="rise" style="animation-delay:1.38s">
  <rect x="25.0" y="200" width="240" height="64" rx="14" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="51.0" cy="232" r="14" fill="#FF6B00"/>
  <text class="sans" x="51.0" y="237" text-anchor="middle" font-size="13" font-weight="900" fill="#0a0a0a">8</text>
  <text class="sans" x="75.0" y="228" font-size="14" font-weight="800" fill="#ffffff">Release · return home</text>
  <text class="mono" x="75.0" y="247" font-size="9.5" fill="#a3a3a3">DROP · PUMP OFF · Nav2 → home</text>
</g>
<rect x=".5" y=".5" width="1099" height="329" rx="24" stroke="#2a2a2a"/>

</svg>
